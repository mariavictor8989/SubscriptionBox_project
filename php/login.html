<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in - FreshBox</title>
    <link rel="stylesheet" href="../css/bootstrap.min.css">
    <style>
        body {
            background-color: #fdfcf7;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; align-items: center;
            justify-content: center; height: 100vh; margin: 0;
        }
        .login-container {
            width: 100%; max-width: 450px; padding: 40px;
            text-align: center; background-color: white;
            border: 1px solid #e0e0e0; border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        .login-container h1 { font-weight: 800; font-size: 2.2rem; margin-bottom: 30px; color: #212529; }
        .form-control {
            border: 1px solid #ddd; border-radius: 8px;
            padding: 12px 15px; margin-bottom: 20px; font-size: 1rem; height: auto;
        }
        .form-control:focus { border-color: #2c7a2c; box-shadow: none; }
        .btn-login {
            background-color: #212529; color: white; width: 100%;
            padding: 14px; border: none; border-radius: 8px;
            font-weight: bold; font-size: 1.1rem; margin-top: 10px; transition: 0.3s;
        }
        .btn-login:hover { background-color: #000; transform: translateY(-1px); }
        .extra-links {
            display: flex; justify-content: space-between;
            margin-top: 5px; margin-bottom: 25px; font-size: 0.85rem;
        }
        .extra-links a { color: #212529; text-decoration: underline; }
        .checkbox-container { display: flex; align-items: center; color: #555; }
        .checkbox-container input { margin-right: 8px; }
    </style>
</head>
<body>
<div class="login-container">
    <h1>📦 FreshBox</h1>
    <form action="login_process.php" method="POST">
        <input type="email" name="user_email" class="form-control" placeholder="Email" required>
        <input type="password" name="user_password" class="form-control" placeholder="Password" required>
        <div class="extra-links">
            <div class="checkbox-container">
                <input type="checkbox" id="keep-signed">
                <label for="keep-signed">Keep me signed in</label>
            </div>
            <a href="#">Forgot Password?</a>
        </div>
        <button type="submit" class="btn-login shadow-sm">Log In</button>
    </form>
    <p style="margin-top: 30px; font-size: 0.9rem; color: #484747;">
        Don't have an account?
        <a href="register.html" style="color: #2c7a2c; font-weight: bold; text-decoration: none;">Register here</a>
    </p>
</div>
</body>
</html>
